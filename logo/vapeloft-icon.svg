<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#0D1426"/>
    </linearGradient>
    <linearGradient id="vaporGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- vapor swirl mark -->
  <g fill="none" stroke="url(#vaporGrad)" stroke-linecap="round">
    <path d="M 140 330 C 140 280, 190 280, 190 240 C 190 200, 150 195, 150 165" stroke-width="22"/>
    <path d="M 210 350 C 210 290, 270 290, 270 235 C 270 180, 220 175, 220 130" stroke-width="26"/>
    <path d="M 300 340 C 300 300, 340 300, 340 260 C 340 220, 305 215, 305 185" stroke-width="18"/>
  </g>

  <!-- rising spark accents -->
  <circle cx="368" cy="150" r="7" fill="#FF2E9A"/>
  <circle cx="150" cy="130" r="5" fill="#00E5FF"/>
  <circle cx="330" cy="175" r="4" fill="#7C3AED"/>

  <!-- base line -->
  <rect x="150" y="378" width="212" height="14" rx="7" fill="url(#vaporGrad)"/>
</svg>
